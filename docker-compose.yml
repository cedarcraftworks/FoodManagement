# 3つのサービスとデータベースをまとめて起動する: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: food_management
      POSTGRES_USER: food_management
      POSTGRES_PASSWORD: food_management
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_management"]
      interval: 3s
      retries: 20

  planner:
    build: { context: ., dockerfile: planner/Dockerfile }
    ports: ["8000:8000"]

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/food_management
      PLANNER_URL: http://planner:8000
      ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      planner: { condition: service_started }
